name: CI/CD

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev, staging, main]

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: python -m ruff check .

      - name: Run all tests
        run: python -m pytest tests -q

      - name: Build Docker image
        run: |
          docker build \
            --build-arg APP_ENV=ci \
            --build-arg MODEL_VERSION=6 \
            -t mpg-app:ci .

  build-staging:
    name: Build staging image
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: staging
      MODEL_VERSION: ${{ secrets.STAGING_MODEL_VERSION }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate configuration
        run: |
          if [ -z "$MODEL_VERSION" ]; then
            echo "::error::STAGING_MODEL_VERSION is not configured"
            exit 1
          fi

      - name: Build staging image
        run: |
          docker build \
            --build-arg APP_ENV="$APP_ENV" \
            --build-arg MODEL_VERSION="$MODEL_VERSION" \
            -t mpg-app:staging .

  build-production:
    name: Build production image
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: production
      MODEL_VERSION: ${{ secrets.PRODUCTION_MODEL_VERSION }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate configuration
        run: |
          if [ -z "$MODEL_VERSION" ]; then
            echo "::error::PRODUCTION_MODEL_VERSION is not configured"
            exit 1
          fi

      - name: Build production image
        run: |
          docker build \
            --build-arg APP_ENV="$APP_ENV" \
            --build-arg MODEL_VERSION="$MODEL_VERSION" \
            -t mpg-app:production .